name: Build iOS connection-test IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-connection-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo '::error::Activate Unity Personal and add the three Unity secrets through the repository Settings page. Do not put credentials in source files.'
            exit 1
          fi
      - name: Export Unity connection-test Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ios-client
          unityVersion: 6000.3.26f1
          targetPlatform: iOS
          buildMethod: Kairisei.Recovery.Editor.RecoveryBuild.BuildIOS
          customParameters: -recoveryOutput ${{ github.workspace }}/build/iOS/Xcode
          versioning: None
          cacheUnityInstallationOnMac: false
          unityHubVersionOnMac: 3.22.6
      - name: Archive device build and package unsigned IPA
        shell: bash
        run: bash scripts/Build-UnsignedIPA.sh "$GITHUB_WORKSPACE/build/iOS/Xcode" "$GITHUB_WORKSPACE/dist/connection-test-$GITHUB_RUN_ID"
      - name: Save sideload package and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: ios-connection-test-unsigned
          path: |
            dist/connection-test-*/*.ipa
            dist/connection-test-*/*.json
            dist/connection-test-*/*.txt
          if-no-files-found: error
          retention-days: 7
