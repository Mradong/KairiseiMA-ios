name: Build iOS resource-bootstrap IPA

on:
  workflow_dispatch:
  push:
    branches:
      - order05a-full-resources-lyd

permissions:
  contents: read

concurrency:
  group: ios-connection-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: kuuhaku1314/kairisei-ma-ch
          ref: d1a202eb539b99511e8a33f3975fac409ab545bf
          path: source-review/kairisei-ma-ch
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: false
      - name: Compile recovered standalone battle bridge for iOS ARM64
        shell: bash
        run: bash scripts/Build-NativeIOS.sh
      - name: Check required Unity activation secrets
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo '::error::Add UNITY_EMAIL and UNITY_PASSWORD through the repository Actions Secrets page. Do not put credentials in source files.'
            exit 1
          fi
      - name: Install Hub and activate Personal through the official client
        id: activate
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash scripts/Unity-CloudLicense.sh prepare
      - name: Export Unity connection-test Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ios-client
          unityVersion: 6000.3.26f1
          targetPlatform: iOS
          buildMethod: Kairisei.Recovery.Editor.RecoveryBuild.BuildIOS
          customParameters: -recoveryOutput ${{ github.workspace }}/build/iOS/Xcode -recoveryResourceOutput ${{ github.workspace }}/build/iOS/ServerContent
          versioning: None
          cacheUnityInstallationOnMac: false
          unityHubVersionOnMac: 3.22.6
          # The previous step activates the real license; Unity still validates
          # it at startup. Avoid asking GameCI to activate it a second time.
          skipActivation: true
      - name: Return the Personal license acquired for this runner
        if: ${{ always() }}
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -f scripts/Unity-CloudLicense.sh ]]; then
            bash scripts/Unity-CloudLicense.sh return
          fi
      - name: Archive device build and package unsigned IPA
        shell: bash
        run: |
          bash scripts/Build-UnsignedIPA.sh "$GITHUB_WORKSPACE/build/iOS/Xcode" "$GITHUB_WORKSPACE/dist/connection-test-$GITHUB_RUN_ID"
          cp native/build/ios-arm64/native-build.json "dist/connection-test-$GITHUB_RUN_ID/native-build.json"
          cp build/iOS/ServerContent/resource-build.json "dist/connection-test-$GITHUB_RUN_ID/resource-build.json"
      - name: Validate iOS server against the compiled resource bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server-ios
          mkdir -p server-ios/server
          cp -R source-review/kairisei-ma-ch/server/. server-ios/server/
          git apply --directory=server-ios patches/ios-server.patch
          export IOS_COMPILED_PROFILE="$GITHUB_WORKSPACE/build/iOS/ServerContent/ios-delivery.json"
          cd server-ios/server
          CGO_ENABLED=0 go test ./internal/cnbootstrap -run 'Test(IOS|Platform|ModernLogin)' -count=1 -timeout=180s -json > "$GITHUB_WORKSPACE/dist/connection-test-$GITHUB_RUN_ID/ios-server-tests.jsonl"
      - name: Save iOS resource delivery package
        uses: actions/upload-artifact@v4
        with:
          name: ios-resource-delivery
          path: build/iOS/ServerContent/
          if-no-files-found: error
          retention-days: 7
      - name: Save sideload package and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: ios-connection-test-unsigned
          path: |
            dist/connection-test-*/*.ipa
            dist/connection-test-*/*.json
            dist/connection-test-*/*.jsonl
            dist/connection-test-*/*.txt
          if-no-files-found: error
          retention-days: 7
